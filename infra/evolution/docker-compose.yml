# Evolution API (WhatsApp de cada salão) + HTTPS + disparo das campanhas.
# Roda numa VPS sempre ligada (ex.: Oracle Cloud Always Free). Ver README.md desta pasta.
services:
  evolution:
    # confira a versão mais nova em https://hub.docker.com/r/evoapicloud/evolution-api/tags
    image: evoapicloud/evolution-api:v2.3.0
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_URL: https://${EVOLUTION_DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URL}
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      # guarda só o necessário: o plano grátis do Neon tem pouco espaço
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      # sem Redis: cache em memória
      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
      CONFIG_SESSION_PHONE_CLIENT: IKIZY
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: 'false'
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances
    expose:
      - '8080'

  # HTTPS automático (Let's Encrypt) na frente da Evolution
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    command: caddy reverse-proxy --from ${EVOLUTION_DOMAIN} --to evolution:8080
    volumes:
      - caddy_data:/data
    depends_on:
      - evolution

  # chama o envio das campanhas a cada minuto (no lugar do Vercel Cron, que no plano grátis só roda 1x por dia)
  dispatch:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - 'while true; do curl -fsS -m 50 -H "Authorization: Bearer $$CRON_SECRET" "$$APP_URL/api/whatsapp/dispatch" > /dev/null || true; sleep 60; done'
    environment:
      CRON_SECRET: ${CRON_SECRET}
      APP_URL: ${APP_URL}

volumes:
  evolution_instances:
  caddy_data:
